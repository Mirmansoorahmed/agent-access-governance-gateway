# Isolated pytest config for the fork-only Access Governance Gateway suite.
#
# Kept separate from pyproject.toml so our tests do not inherit upstream APM's
# markers / addopts (e.g. --strict-markers). Placed at the repo root so
# rootdir == repo root and testpaths resolve correctly. Run with:
#   PYTHONPATH=. python -m pytest -c pytest-gateway.ini
[pytest]
testpaths = gateway/tests
addopts = -q -p no:cacheprovider
